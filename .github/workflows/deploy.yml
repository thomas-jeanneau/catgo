# Builds the static site with Sovrium and publishes it to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sovrium
        run: |
          curl -fsSL https://sovrium.com/install | sh
          echo "$HOME/.sovrium/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Work out the base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          # A <owner>.github.io repository is served at the domain root; any other repository under /<repo>.
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${repo}" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and build
        env:
          SOVRIUM_OUTPUT_DIR: ./dist
          SOVRIUM_BASE_PATH: ${{ steps.base.outputs.path }}
          SOVRIUM_BASE_URL: ${{ steps.base.outputs.url }}
        run: |
          sovrium --version
          sovrium validate app.yaml
          sovrium build app.yaml
          rm -f dist/README.md
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
